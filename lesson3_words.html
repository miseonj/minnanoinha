* { box-sizing: border-box; margin: 0; padding: 0; }
body {

  padding: 20px;

.header { text-align: center; margin-bottom: 20px; }
.header h1 { color: #28B4A6; font-size: 13px; letter-spacing: 2px; margin-bottom: 4px; font-weight: 400; }
.header h2 { color: white; font-size: 26px; font-weight: 700; }
.section-nav {
  display: flex; gap: 8px; margin-bottom: 14px;
  flex-wrap: wrap; justify-content: center;
}
.sec-btn {
  padding: 5px 14px; border-radius: 20px;
  border: 2px solid rgba(255,255,255,0.25);
  background: transparent; color: rgba(255,255,255,0.6);
  font-size: 12px; cursor: pointer; transition: all 0.2s;
  font-family: 'Noto Sans JP', 'Malgun Gothic', sans-serif;
}
.sec-btn:hover, .sec-btn.active {
  background: rgba(255,255,255,0.18); color: white;

}
.card-wrap { width: 100%; max-width: 520px; }
.badge-row { margin-bottom: 10px; }
.section-badge {

  font-size: 11px; font-weight: 700; color: white; letter-spacing: 1px;
  background: #28B4A6;
}
.card {
  background: white; border-radius: 20px;
  padding: 32px 32px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  text-align: center; min-height: 290px;

  align-items: center; justify-content: center;
  position: relative;
}
.card-bar {

}
.emoji { font-size: 48px; margin-bottom: 10px; line-height: 1; }
.hira {

}
.hira.long { font-size: 30px; }
.hira.medium { font-size: 44px; }
.hira.longmed { font-size: 36px; }
.kanji {
  font-size: 18px; margin-bottom: 5px; line-height: 1.5;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 400; color: #28B4A6;
  white-space: pre-line;

.divider { width: 70px; height: 3px; background: #F5A623; border-radius: 2px; margin: 10px auto 12px; }
.korean { font-size: 20px; font-weight: 700; color: #1A3550; }
.korean.long { font-size: 15px; }
.audio-btn {
  margin-top: 18px; width: 52px; height: 52px; border-radius: 50%;
  background: #1A3550; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; box-shadow: 0 4px 12px rgba(26,53,80,0.25);
}
.audio-btn:hover { background: #28B4A6; transform: scale(1.08); }
.audio-btn:active { transform: scale(0.95); }
.audio-btn svg { width: 22px; height: 22px; fill: white; }
.audio-btn.playing {
  background: #28B4A6;
  animation: pulse 0.6s ease-in-out infinite alternate;
}
@keyframes pulse {
  from { box-shadow: 0 4px 12px rgba(40,180,166,0.3); }
  to { box-shadow: 0 4px 28px rgba(40,180,166,0.7); }
}
.nav { display: flex; align-items: center; gap: 14px; margin-top: 18px; justify-content: center; }
.nav-btn {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.25);
  color: white; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.nav-btn:hover { background: rgba(255,255,255,0.22); }
.nav-btn:disabled { opacity: 0.25; cursor: default; }
.counter { color: rgba(255,255,255,0.75); font-size: 13px; min-width: 70px; text-align: center; }
.counter span { color: white; font-weight: 700; font-size: 17px; }
.progress-bar {
  width: 100%; max-width: 520px; height: 4px;
  background: rgba(255,255,255,0.12); border-radius: 2px;
  margin-top: 14px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: #28B4A6; border-radius: 2px;
  transition: width 0.3s ease;
}
.hint { color: rgba(255,255,255,0.35); font-size: 11px; margin-top: 10px; text-align: center; }

let currentAudio = null;

function render() {
  const [num, hira, kanji, korean, emoji] = words[cur];
  document.getElementById('emoji').textContent = emoji;

  const hiraEl = document.getElementById('hira');
  hiraEl.textContent = hira;
  const hiraLen = hira.replace(/\n/g,'').length;
  hiraEl.className = 'hira' +
    (hiraLen > 14 ? ' long' :
     hiraLen > 10 ? ' longmed' :
     hiraLen > 7  ? ' medium' : '');

  const kanjiEl = document.getElementById('kanji');
  if (kanji) {
    kanjiEl.textContent = kanji;
    kanjiEl.style.display = 'block';
  } else {
    kanjiEl.style.display = 'none';
  }

  const korEl = document.getElementById('korean');
  korEl.textContent = korean;
  korEl.className = 'korean' + (korean.length > 12 ? ' long' : '');

  document.getElementById('cur').textContent = num;
  document.getElementById('progress').style.width = (num / 36 * 100) + '%';
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === words.length - 1;
  document.getElementById('audio-btn').classList.remove('playing');

  setTimeout(playAudio, 250);
}

function playAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const num = words[cur][0];
  if (!audioData[String(num)]) return;
  const btn = document.getElementById('audio-btn');
  btn.classList.add('playing');
  currentAudio = new Audio('data:audio/mpeg;base64,' + audioData[String(num)]);
  currentAudio.play();
  currentAudio.onended = () => { btn.classList.remove('playing'); currentAudio = null; };
}

function next() { if (cur < words.length - 1) { cur++; render(); } }
function prev() { if (cur > 0) { cur--; render(); } }

function jumpTo(idx, btn) {
  cur = idx; render();
  document.querySelectorAll('.sec-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'r' || e.key === 'R') playAudio();
});

render();
</script>
