let filtered = [...allWords];
let current = 0, revealed = false;

function fontSize(s){
  const n=[...s].length;
  if(n<=3) return '3.4rem';
  if(n===4) return '2.9rem';
  if(n===5) return '2.5rem';
  return '2.05rem';
}
function setCat(cat, btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filtered = cat==='전체' ? [...allWords] : allWords.filter(w=>w.cat===cat);
  current=0; render();
}
function playAudio(){ if(filtered[current]) new Audio(filtered[current].audio).play().catch(()=>{}); }
function render(){
  const main=document.getElementById('main'), navInfo=document.getElementById('nav-info'),
        fill=document.getElementById('fill'), prevBtn=document.getElementById('prev-btn');
  if(current>=filtered.length){
    main.innerHTML='<div class="done"><h2>완료! 🎉</h2><p>'+filtered.length+'개 완주!</p><button class="restart-btn" onclick="restart()">처음부터 다시</button></div>';
    navInfo.innerHTML=''; fill.style.width='100%'; return;
  }
  const w=filtered[current]; revealed=false;
  navInfo.innerHTML='<span>'+(current+1)+'</span> / '+filtered.length;
  fill.style.width=((current/filtered.length)*100)+'%';
  prevBtn.disabled=current===0;
  const tagClass = w.cat==='な형용사' ? 'cat-tag na' : 'cat-tag';
  const kanjiLine = w.kanji ? '<div class="kanji-text">'+w.kanji+'</div>' : '';
  main.innerHTML=
    '<div class="card" id="card" onclick="revealCard()">'+
      '<span class="num-badge">'+w.num+'</span>'+
      '<span class="'+tagClass+'">'+w.cat+'</span>'+
      '<div class="front-text" style="font-size:'+fontSize(w.jp)+'">'+w.jp+'</div>'+
      '<div class="divider"></div>'+kanjiLine+
      '<div class="ko-text">'+w.ko+'</div>'+
      '<div class="audio-wrap"><button class="audio-btn" onclick="event.stopPropagation();playAudio()">&#128266;</button></div>'+
      '<div class="tap-hint">탭하면 뜻 · 발음</div>'+
    '</div>';
  setTimeout(playAudio,300);
}
function revealCard(){ if(revealed)return; revealed=true; document.getElementById('card').classList.add('revealed'); }
function next(){ current++; render(); }
function prev(){ if(current>0){current--; render();} }
function restart(){ current=0; render(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault(); if(!revealed)revealCard(); else next();}
  if(e.key==='ArrowLeft') prev();
  if(e.key==='r'||e.key==='R') playAudio();
});
render();
</script>
