<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민나노 일본어 4과 단어</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --primary: #2d6a4f;
    --primary-light: #52b788;
    --accent: #f4a261;
    --bg: #f8f9f4;
    --card-bg: #ffffff;
    --card-back: #2d6a4f;
    --text: #1b1b1b;
    --text-light: #666;
    --border: #d8e8d8;
    --shadow: 0 4px 16px rgba(0,0,0,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* 헤더 */
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding: 24px 20px;
    background: var(--primary);
    border-radius: 16px;
    color: white;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
  }
  .header .subtitle { font-size: 12px; opacity: 0.7; letter-spacing: 0.08em; margin-bottom: 4px; }
  .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .header .count { font-size: 13px; opacity: 0.8; }

  /* 진행바 */
  .progress-wrap {
    max-width: 640px;
    margin: 0 auto 20px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary-light);
    border-radius: 99px;
    transition: width 0.3s;
  }

  /* 카드 영역 */
  .card-area {
    max-width: 640px;
    margin: 0 auto 20px;
    perspective: 1000px;
  }

  .card-wrap {
    width: 100%;
    height: 220px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s ease;
    position: relative;
  }
  .card-wrap.flipped { transform: rotateY(180deg); }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .card-front {
    background: var(--card-bg);
    border: 1px solid var(--border);
  }
  .card-front .hint {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 12px;
  }
  .card-front .jp {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
    text-align: center;
  }
  .card-front .reading {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    color: var(--text-light);
  }
  .card-front .audio-btn {
    margin-top: 16px;
    background: var(--primary-light);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-front .audio-btn:hover { background: var(--primary); }

  .card-back {
    background: var(--card-back);
    transform: rotateY(180deg);
    color: white;
  }
  .card-back .ko {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }
  .card-back .jp-small {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    opacity: 0.8;
    text-align: center;
  }
  .card-back .kanji {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    opacity: 0.6;
    margin-top: 4px;
  }

  /* 카드 번호 태그 */
  .card-tag {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 11px;
    color: var(--text-light);
  }
  .card-back .card-tag { color: rgba(255,255,255,0.5); }

  /* 버튼 */
  .btn-row {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 12px 28px;
    border-radius: 99px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-prev { background: white; color: var(--primary); border: 2px solid var(--border); }
  .btn-prev:hover { border-color: var(--primary); }
  .btn-next { background: var(--primary); color: white; }
  .btn-next:hover { background: #1b4332; }
  .btn-shuffle { background: var(--accent); color: white; }
  .btn-shuffle:hover { background: #e07b3a; }

  /* 카드 목록 */
  .list-section {
    max-width: 640px;
    margin: 36px auto 0;
  }
  .list-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }
  .word-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .word-item:hover { border-color: var(--primary-light); }
  .word-item.active { border-color: var(--primary); background: #f0f7f0; }
  .word-item .w-jp {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
  }
  .word-item .w-ko {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* 카테고리 구분선 */
  .category-label {
    grid-column: 1 / -1;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary-light);
    letter-spacing: 0.05em;
    padding: 8px 0 4px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .category-label:first-child { border-top: none; margin-top: 0; }
</style>
</head>
<body>

<div class="header">
  <div class="subtitle">みんなの日本語 初級Ⅰ · 第4課</div>
  <h1>そちらは 何時までですか</h1>
  <div class="count">단어 카드 51장</div>
</div>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="progress-text">1 / 51</span>
    <span id="progress-pct">2%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:2%"></div></div>
</div>

<div class="card-area">
  <div class="card-wrap" id="card" onclick="flipCard()">
    <div class="card-front">
      <div class="card-tag" id="card-num-front">1 / 51</div>
      <div class="hint">탭하면 뜻이 나와요</div>
      <div class="jp" id="card-jp">おきます</div>
      <div class="reading" id="card-reading"></div>
      <button class="audio-btn" onclick="playAudio(event)">🔊 듣기</button>
    </div>
    <div class="card-back">
      <div class="card-tag" id="card-num-back">1 / 51</div>
      <div class="ko" id="card-ko">일어납니다</div>
      <div class="jp-small" id="card-jp-back">おきます</div>
      <div class="kanji" id="card-kanji">起きます</div>
    </div>
  </div>
</div>

<div class="btn-row">
  <button class="btn btn-prev" onclick="prevCard()">◀ 이전</button>
  <button class="btn btn-shuffle" onclick="shuffleCards()">🔀 섞기</button>
  <button class="btn btn-next" onclick="nextCard()">다음 ▶</button>
</div>

<div class="list-section">
  <div class="list-title">📋 전체 단어 목록</div>
  <div class="word-grid" id="word-grid"></div>
</div>

let order = words.map((_, i) => i);
let current = 0;
let flipped = false;

function updateCard() {
  const w = words[order[current]];
  const total = order.length;
  const num = current + 1;

  document.getElementById('card-jp').textContent = w.jp;
  document.getElementById('card-reading').textContent = '';
  document.getElementById('card-ko').textContent = w.ko;
  document.getElementById('card-jp-back').textContent = w.jp;
  document.getElementById('card-kanji').textContent = w.kanji;
  document.getElementById('card-num-front').textContent = `${num} / ${total}`;
  document.getElementById('card-num-back').textContent = `${num} / ${total}`;
  document.getElementById('progress-text').textContent = `${num} / ${total}`;
  document.getElementById('progress-pct').textContent = Math.round(num/total*100) + '%';
  document.getElementById('progress-fill').style.width = (num/total*100) + '%';

  // 목록 활성화
  document.querySelectorAll('.word-item').forEach((el, i) => {
    el.classList.toggle('active', i === order[current]);
  });

  // 카드 앞면으로
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
  if (flipped) playAudioAuto();
}

function playAudioAuto() {
  const w = words[order[current]];
  const audio = new Audio(w.audio);
  audio.play().catch(() => {});
}

function playAudio(e) {
  e.stopPropagation();
  playAudioAuto();
}

function nextCard() {
  if (current < order.length - 1) {
    current++;
    updateCard();
  }
}

function prevCard() {
  if (current > 0) {
    current--;
    updateCard();
  }
}

function shuffleCards() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  current = 0;
  updateCard();
}

function goToCard(idx) {
  current = order.indexOf(idx);
  if (current === -1) current = 0;
  updateCard();
}

// 단어 목록 생성
function buildWordGrid() {
  const grid = document.getElementById('word-grid');
  let lastCat = '';
  words.forEach((w, i) => {
    if (w.cat !== lastCat) {
      const label = document.createElement('div');
      label.className = 'category-label';
      label.textContent = w.cat;
      grid.appendChild(label);
      lastCat = w.cat;
    }
    const item = document.createElement('div');
    item.className = 'word-item' + (i === 0 ? ' active' : '');
    item.innerHTML = `<div class="w-jp">${w.jp}</div><div class="w-ko">${w.ko}</div>`;
    item.onclick = () => goToCard(i);
    grid.appendChild(item);
  });
}

// 키보드
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft') prevCard();
  if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

buildWordGrid();
updateCard();
</script>
