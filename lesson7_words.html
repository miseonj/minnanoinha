<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんなの日本語 7課 単語</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --c1:#1c7ed6; --c2:#339af0; --tint:#e7f1ff; --ink:#fff; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 22px 16px 28px;
  background:
    radial-gradient(circle at 12% 8%, var(--tint) 0 22%, transparent 23%),
    radial-gradient(circle at 92% 20%, var(--tint) 0 12%, transparent 13%),
    radial-gradient(circle at 80% 92%, var(--tint) 0 26%, transparent 27%),
    radial-gradient(circle at 6% 85%, var(--tint) 0 10%, transparent 11%),
    #fffdf8;
  overflow-x: hidden;
}
h1 { font-size: 20px; color: #333; margin-bottom: 14px; letter-spacing: .05em; font-weight: 900; }
h1 span { background: linear-gradient(90deg, #1c7ed6, #d6336c, #e6a100, #2b8a3e); -webkit-background-clip: text; background-clip: text; color: transparent; }
.counter { font-size: 14px; color: #777; margin-bottom: 14px; font-weight: 700; }

.card-wrap { perspective: 1100px; width: min(92vw, 460px); aspect-ratio: 3 / 2; margin-bottom: 22px; cursor: pointer; }
.card-wrap.pop { animation: pop .45s ease; }
@keyframes pop {
  0%   { transform: scale(.88) rotate(-2.5deg); opacity: .35; }
  60%  { transform: scale(1.04) rotate(1deg); opacity: 1; }
  100% { transform: none; }
}
.card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.34, 1.45, .64, 1); }
.card.flipped { transform: rotateY(180deg); }
.front, .back {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 10px 28px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.08);
  overflow: hidden;
}
.front {
  background:
    radial-gradient(circle at 92% 8%, rgba(255,255,255,.9) 0 10%, transparent 11%),
    linear-gradient(160deg, #ffffff 0%, var(--tint) 100%);
  border: 4px solid var(--c1);
}
.back {
  background:
    radial-gradient(circle at 88% 14%, rgba(255,255,255,.28) 0 13%, transparent 14%),
    radial-gradient(circle at 8% 92%, rgba(255,255,255,.2) 0 17%, transparent 18%),
    linear-gradient(145deg, var(--c1), var(--c2));
  color: var(--ink);
  transform: rotateY(180deg);
}
.num { position: absolute; top: 14px; left: 18px; font-size: 13px; font-weight: 700; color: var(--c1); opacity: .6; }
.back .num { color: var(--ink); opacity: .65; }
.chip {
  position: absolute; top: 12px; right: 14px;
  background: var(--c1); color: var(--ink);
  font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.back .chip { background: rgba(255,255,255,.9); color: var(--c1); }
.jp-text { white-space: pre; text-align: center; font-size: clamp(30px, 8.4vw, 46px); font-weight: 900; color: #1a1a1a; letter-spacing: .05em; line-height: 1.35; }
.kanji-text { font-size: 16px; color: var(--c1); font-weight: 700; letter-spacing: .08em; min-height: 1em; }
.ko-text { font-size: clamp(22px, 6.4vw, 30px); font-weight: 900; text-align: center; padding: 0 16px; line-height: 1.4; text-shadow: 0 1px 2px rgba(0,0,0,.12); }
.ko-note { font-size: 13px; text-align: center; padding: 0 22px; line-height: 1.5; opacity: .92; }
.hint { font-size: 12px; color: #999; margin-top: 4px; }
.back .hint { color: var(--ink); opacity: .6; }

.btn-row { display: flex; gap: 12px; margin-bottom: 18px; }
button {
  font-family: 'Noto Sans JP', sans-serif; padding: 11px 24px; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700; cursor: pointer; transition: transform .12s, box-shadow .12s;
  box-shadow: 0 3px 0 rgba(0,0,0,.14);
}
button:hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(0,0,0,.14); }
button:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,.14); }
.btn-prev { background: #fff; color: var(--c1); border: 2px solid var(--c1); }
.btn-audio { background: linear-gradient(135deg, var(--c2), var(--c1)); color: var(--ink); }
.btn-next { background: linear-gradient(135deg, var(--c1), var(--c2)); color: var(--ink); }

.progress { width: min(92vw, 460px); display: flex; gap: 2px; height: 14px; }
.seg { flex: 1; border-radius: 4px; opacity: .28; cursor: pointer; transition: opacity .2s, transform .2s; }
.seg.on { opacity: 1; }
.seg.cur { transform: scaleY(1.5); }
.keys { margin-top: 14px; font-size: 12px; color: #999; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#toast {
  position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.8);
  background: #fff; color: #333; font-weight: 900; font-size: 24px;
  padding: 18px 28px; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none; z-index: 60; transition: opacity .3s, transform .3s;
}
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; } .card-wrap.pop { animation: none; }
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="toast">🎉 7과 단어 끝! 수고하셨어요</div>
<h1>みんなの日本語 第7課 <span>単語</span></h1>
<div class="counter" id="counter">1 / 44</div>
<div class="card-wrap" id="wrap" onclick="flipCard()">
  <div class="card" id="card">
    <div class="front">
      <span class="num" id="front-num">1</span>
      <span class="chip" id="front-chip"></span>
      <div class="jp-text" id="jp-text"></div>
      <div class="kanji-text" id="kanji-text"></div>
      <div class="hint">클릭해서 뒤집기</div>
    </div>
    <div class="back">
      <span class="num" id="back-num">1</span>
      <span class="chip" id="back-chip"></span>
      <div class="ko-text" id="ko-text"></div>
      <div class="ko-note" id="ko-note"></div>
      <div class="hint">클릭해서 뒤집기</div>
    </div>
  </div>
</div>
<div class="btn-row">
  <button class="btn-prev" onclick="prevCard()">◀ 이전</button>
  <button class="btn-audio" onclick="playAudio()">🔊 듣기</button>
  <button class="btn-next" onclick="nextCard()">다음 ▶</button>
</div>
<div class="progress" id="progress"></div>
<div class="keys">← → 이동 · Space 뒤집기 · Enter 듣기 · 아래 색 막대를 누르면 점프</div>

let current = 0;
let flipped = false;
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// 아래 색 막대 (카드 1장 = 칸 1개)
const prog = document.getElementById('progress');
cards.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'seg';
  s.style.background = CATS[c.cat].c1;
  s.title = (i + 1) + '. ' + c.jp.replace('\n', ' ');
  s.onclick = (e) => { e.stopPropagation(); jumpTo(i); };
  prog.appendChild(s);
});

function render(anim) {
  const c = cards[current];
  const k = CATS[c.cat];
  const root = document.documentElement.style;
  root.setProperty('--c1', k.c1); root.setProperty('--c2', k.c2);
  root.setProperty('--tint', k.tint); root.setProperty('--ink', k.ink);
  document.getElementById('front-num').textContent = c.num;
  document.getElementById('back-num').textContent = c.num;
  document.getElementById('front-chip').textContent = k.emoji + ' ' + k.name;
  document.getElementById('back-chip').textContent = k.emoji + ' ' + k.name;
  document.getElementById('jp-text').textContent = c.jp;
  document.getElementById('kanji-text').textContent = c.kanji;
  document.getElementById('ko-text').textContent = c.ko;
  document.getElementById('ko-note').textContent = c.note || '';
  document.getElementById('counter').textContent = (current + 1) + ' / ' + cards.length;
  prog.querySelectorAll('.seg').forEach((s, i) => {
    s.classList.toggle('on', i <= current);
    s.classList.toggle('cur', i === current);
  });
  document.getElementById('card').classList.toggle('flipped', flipped);
  if (anim && !reduce) {
    const w = document.getElementById('wrap');
    w.classList.remove('pop'); void w.offsetWidth; w.classList.add('pop');
  }
}

function flipCard() {
  flipped = !flipped;
  render();
  if (flipped && current === cards.length - 1) celebrate();
}
function go(i, sound) {
  current = i; flipped = false; render(true);
  if (sound) playAudio();
}
function nextCard() {
  if (current < cards.length - 1) go(current + 1, true);
  else celebrate();
}
function prevCard() { if (current > 0) go(current - 1, true); }
function jumpTo(i) { go(i, true); }

let currentAudio = null;
function playAudio() {
  const c = cards[current];
  if (!c.audio) return;
  if (currentAudio) { currentAudio.pause(); }
  currentAudio = new Audio('data:audio/mpeg;base64,' + c.audio);
  currentAudio.play();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft') prevCard();
  if (e.key === ' ') { e.preventDefault(); flipCard(); }
  if (e.key === 'Enter') playAudio();
});

// 🎉 마지막 카드 축하 효과
function celebrate() {
  const t = document.getElementById('toast');
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200);
  if (reduce) return;
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = Object.values(CATS).map(k => k.c1).concat(['#ffd43b', '#ff8787', '#74c0fc']);
  const ps = Array.from({length: 160}, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .55,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4,
    w: 6 + Math.random() * 7, h: 8 + Math.random() * 8,
    r: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
    c: colors[(Math.random() * colors.length) | 0]
  }));
  const t0 = performance.now();
  (function frame(now) {
    const dt = now - t0;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .99;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - dt / 3200);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (dt < 3200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

render();
</script>
