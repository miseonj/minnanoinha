<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんなの日本語 6課 単語</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: #f5f5f0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
}
h1 {
  font-size: 18px;
  color: #333;
  margin-bottom: 20px;
  letter-spacing: .05em;
}
.counter {
  font-size: 13px;
  color: #888;
  margin-bottom: 16px;
}
.card-wrap {
  perspective: 1000px;
  width: 340px;
  height: 220px;
  margin-bottom: 24px;
  cursor: pointer;
}
.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.45s ease;
}
.card.flipped { transform: rotateY(180deg); }
.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10);
}
.front {
  background: #fff;
  border: 2px solid #e8e8e0;
}
.back {
  background: #2e5fa3;
  transform: rotateY(180deg);
}
.num {
  position: absolute;
  top: 12px;
  left: 16px;
  font-size: 12px;
  color: #bbb;
}
.back .num { color: rgba(255,255,255,0.5); }
.jp-text {
  white-space: pre;
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: .05em;
}
.kanji-text {
  font-size: 14px;
  color: #888;
  letter-spacing: .08em;
}
.ko-text {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
}
.hint {
  font-size: 12px;
  color: #bbb;
  margin-top: 4px;
}
.back .hint { color: rgba(255,255,255,0.5); }
.btn-row {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}
button {
  font-family: 'Noto Sans JP', sans-serif;
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: opacity .15s;
}
button:hover { opacity: .85; }
.btn-prev { background: #e8e8e0; color: #444; }
.btn-audio { background: #4a90d9; color: #fff; }
.btn-next { background: #2e5fa3; color: #fff; }
.progress {
  width: 340px;
  height: 4px;
  background: #e0e0d8;
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: #2e5fa3;
  border-radius: 2px;
  transition: width .3s;
}
</style>
</head>
<body>
<h1>みんなの日本語 第6課 単語</h1>
<div class="counter" id="counter">1 / 48</div>
<div class="card-wrap" onclick="flipCard()">

    <div class="front">
      <span class="num" id="front-num">1</span>
      <div class="jp-text" id="jp-text"></div>
      <div class="kanji-text" id="kanji-text"></div>
      <div class="hint">클릭해서 뒤집기</div>
    </div>
    <div class="back">
      <span class="num" id="back-num">1</span>
      <div class="ko-text" id="ko-text"></div>
      <div class="hint">클릭해서 뒤집기</div>
    </div>
  </div>
</div>
<div class="btn-row">
  <button class="btn-prev" onclick="prevCard()">◀ 이전</button>
  <button class="btn-audio" onclick="playAudio()">🔊 듣기</button>
  <button class="btn-next" onclick="nextCard()">다음 ▶</button>
</div>
<div class="progress">
  <div class="progress-bar" id="progress-bar"></div>
</div>

let current = 0;
let flipped = false;

function render() {
  const c = cards[current];
  document.getElementById('front-num').textContent = c.num;
  document.getElementById('back-num').textContent = c.num;
  document.getElementById('jp-text').textContent = c.jp;
  document.getElementById('kanji-text').textContent = c.kanji;
  document.getElementById('ko-text').textContent = c.ko;
  document.getElementById('counter').textContent = (current+1) + ' / ' + cards.length;
  document.getElementById('progress-bar').style.width = ((current+1)/cards.length*100) + '%';
  if (flipped) {
    document.getElementById('card').classList.add('flipped');
  } else {
    document.getElementById('card').classList.remove('flipped');
  }
}

function flipCard() {
  flipped = !flipped;
  render();
}

function nextCard() {
  if (current < cards.length - 1) {
    current++;
    flipped = false;
    render();
    playAudio();
  }
}

function prevCard() {
  if (current > 0) {
    current--;
    flipped = false;
    render();
    playAudio();
  }
}

function playAudio() {
  const c = cards[current];
  if (!c.audio) return;
  const audio = new Audio('data:audio/mpeg;base64,' + c.audio);
  audio.play();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft') prevCard();
  if (e.key === ' ') { e.preventDefault(); flipCard(); }
  if (e.key === 'Enter') playAudio();
});

render();
</script>
